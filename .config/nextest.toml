# cargo-nextest config (https://nexte.st). `make ci` / `make test-unit` use it.

[profile.default]
# Report a test as slow after 60 s and kill it after 120 s, so a hang fails
# with the test's name instead of stalling the job.
slow-timeout = { period = "60s", terminate-after = 2 }
# Run every test even after a failure, to see them all in one run.
fail-fast = false

[profile.ci]
slow-timeout = { period = "60s", terminate-after = 2 }
fail-fast = false
# Print each test as it starts and finishes (the log shows what was running).
status-level = "all"
final-status-level = "slow"
