[workspace]
resolver = "3"
members = [
    "crates/stems-config",
    "crates/stems-core",
    "crates/stems-runtime",
    "crates/stems-api",
    "crates/stems-daemon",
    "crates/stems-cli",
    "crates/stems-tui",
    "crates/stems-mcp",
    "tests/stems-e2e",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/humbertopoliti/stems"

[workspace.dependencies]
# Internal crates
stems-config = { path = "crates/stems-config", version = "0.1.0" }
stems-core = { path = "crates/stems-core", version = "0.1.0" }
stems-runtime = { path = "crates/stems-runtime", version = "0.1.0" }
stems-api = { path = "crates/stems-api", version = "0.1.0" }
stems-daemon = { path = "crates/stems-daemon", version = "0.1.0" }
stems-tui = { path = "crates/stems-tui", version = "0.1.0" }
stems-mcp = { path = "crates/stems-mcp", version = "0.1.0" }

# External crates
clap = { version = "4.6.7", features = ["derive"] }
humantime = "2.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
insta = { version = "1.48.0", features = ["yaml"] }
marked-yaml = "0.8.0"
petgraph = "0.8.3"
regex = "1.13.1"
schemars = { version = "1.2.2", features = ["preserve_order", "indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tokio = { version = "1.53.1", features = ["full"] }
nix = { version = "0.31.3", features = ["signal", "process", "fs"] }
libproc = "0.14.11"
libc = "0.2.189"
async-trait = "0.1.92"
tokio-util = { version = "0.7.19", features = ["codec"] }
tokio-stream = "0.1.19"
futures = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sha2 = "0.11.0"
globset = "0.4.20"
# Watchdogs (24).
notify = "9.0.0-rc.5"
notify-debouncer-full = "0.8.0-rc.2"
dirs = "7.0.0"
ulid = "3.0.0"
tar = "0.4.46"
flate2 = "1.1.10"
bollard = "0.21"
bytes = "1.12.1"
semver = "1.0.28"
# Health probes (21): http via rustls only (no native-tls).
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
# MCP server (31) and the e2e harness's MCP test client.
rmcp = { version = "3.4.1", default-features = false }

[profile.release]
lto = "thin"
strip = true

# cargo-dist builds release artifacts with this profile (deliverable 32).
[profile.dist]
inherits = "release"
