# cargo-dist configuration (deliverable 32, FR-DS-1, FR-DS-3).
#
# `dist plan` shows what a tag would build; `dist generate` rewrites
# .github/workflows/release.yml from this file (never edit release.yml by
# hand: customisations live in the three `./…` workflows below and in
# .github/build-setup.yml). See release/RELEASING.md.
[workspace]
members = ["cargo:."]

[dist]
# The dist version release.yml installs; bump with `dist init` / `dist generate`.
cargo-dist-version = "0.32.0"
ci = "github"
# Tarballs (+ .sha256 and sha256.sum) for every target, and `curl | sh`
# installer.sh. The Homebrew formula is rendered by our own publish job from
# release/formula/stems.rb.tmpl because dist's generated formula cannot
# install shell completions or man pages.
installers = ["shell"]
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
# installer.sh puts `stems` in ~/.local/bin (not ~/.cargo/bin, so
# `stems upgrade` can tell an installer install from `cargo install`).
install-path = ["$XDG_BIN_HOME/", "$XDG_DATA_HOME/../bin", "~/.local/bin"]
install-updater = false
# Only packages that opt in are built (crates/stems-cli sets `dist = true`).
dist = false
# Completions and man pages generated by release/build-extras.sh (run by
# .github/build-setup.yml before `dist build`) go into every tarball.
include = ["target/dist-extras/completions", "target/dist-extras/man"]
github-build-setup = "../build-setup.yml"
# Smoke-test the just-built tarballs (brew on both Mac architectures,
# installer.sh on Linux) BEFORE the GitHub Release is created; a failure
# stops the release.
global-artifacts-jobs = ["./release-smoke"]
# After the release exists: render the formula and push it to the tap.
publish-jobs = ["./publish-homebrew"]
# `-rc` tags also run the publish job; it pushes prereleases to the tap's
# `rc` branch, so the stable formula on the default branch is untouched.
publish-prereleases = true
