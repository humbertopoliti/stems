name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: Commands you ran and a minimal stems.yaml, if relevant.
      render: shell
    validations:
      required: true
  - type: textarea
    id: version
    attributes:
      label: Version
      description: Output of `stems --version --json`.
      render: json
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, or attach a bundle from `stems logs --export`.
      render: text
