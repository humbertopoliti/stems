# Regenerate CHANGELOG.md with git-cliff (cliff.toml, conventional commits)
# and commit it to the default branch (deliverable 32). Called by
# release.yml (dist-workspace.toml `post-announce-jobs`) after the release
# is announced. Stable releases only: prereleases fold into the next one.
name: release-changelog

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  changelog:
    if: ${{ !fromJson(inputs.plan).announcement_is_prerelease }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}
      - name: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      - name: Commit CHANGELOG.md
        run: |
          git config user.name "stems-release-bot"
          git config user.email "stems-release-bot@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore(release): update CHANGELOG.md for ${{ fromJson(inputs.plan).announcement_tag }}" || exit 0
          git push origin HEAD
