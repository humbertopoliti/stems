# Release smoke test (deliverable 32). Called by release.yml (generated by
# cargo-dist; dist-workspace.toml `global-artifacts-jobs`) after the
# tarballs are built and BEFORE the GitHub Release is created: if any job
# here fails, nothing is published.
#
#   macOS (arm64 + x86_64): render the formula against the just-built
#     tarballs (file:// URLs), `brew install` it from a throwaway local tap,
#     `brew test`, then release/smoke.sh with completions/man REQUIRED.
#   Linux (x86_64): build installer.sh like the global job does, serve the
#     tarballs over localhost, install with it, then release/smoke.sh.
name: release-smoke

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_ENV_HINTS: "1"

jobs:
  smoke-macos:
    name: smoke (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel is the x86_64 image
          # (macos-13 is retired). Same runners cargo-dist builds on.
          - runner: macos-latest
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the built tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Render a formula that installs from the local tarballs
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          ls -l dist
          python3 release/render_formula.py --dist dist --version "$TAG" \
            --base-url "file://$PWD/dist" \
            --homepage "https://github.com/${{ github.repository }}" \
            --out "$RUNNER_TEMP/stems.rb"
      - name: brew install from a local tap
        run: |
          brew tap-new --no-git stems-smoke/local
          tap="$(brew --repository)/Library/Taps/stems-smoke/homebrew-local"
          cp "$RUNNER_TEMP/stems.rb" "$tap/Formula/stems.rb"
          brew install --formula stems-smoke/local/stems
          brew test stems-smoke/local/stems
          brew audit --formula --strict stems-smoke/local/stems || echo "::warning::brew audit reported issues"
      - name: release/smoke.sh
        env:
          SMOKE_BREW: "1"
          SMOKE_STRICT_LEAKS: "1"
          SMOKE_EXAMPLES: ${{ github.workspace }}/examples
        run: release/smoke.sh "$(brew --prefix)/bin/stems"
      - name: brew uninstall
        if: always()
        run: brew uninstall --formula stems-smoke/local/stems || true

  smoke-linux:
    name: smoke (x86_64-unknown-linux-gnu, installer.sh)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch the built tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-build-local-*
          path: target/distrib
          merge-multiple: true
      - name: Install cached dist
        uses: actions/download-artifact@v8
        with:
          name: cargo-dist-cache
          path: ~/.cargo/bin/
      - name: Build installer.sh (as build-global-artifacts does)
        env:
          TAG: ${{ fromJson(inputs.plan).announcement_tag }}
        run: |
          chmod +x ~/.cargo/bin/dist
          dist build --tag="$TAG" --output-format=json --artifacts=global > /dev/null
          ls -l target/distrib
      - name: Install with installer.sh from a localhost mirror
        run: |
          (cd target/distrib && python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          INSTALLER_DOWNLOAD_URL=http://127.0.0.1:8765 \
          STEMS_CLI_INSTALL_DIR="$RUNNER_TEMP/stems-prefix/bin" \
          INSTALLER_NO_MODIFY_PATH=1 \
            sh target/distrib/stems-cli-installer.sh
          ls -l "$RUNNER_TEMP/stems-prefix/bin"
      - name: release/smoke.sh
        env:
          SMOKE_STRICT_LEAKS: "1"
          SMOKE_EXAMPLES: ${{ github.workspace }}/examples
        run: release/smoke.sh "$RUNNER_TEMP/stems-prefix/bin/stems"
      - name: Tarball contents (completions, man pages)
        run: |
          tar -tJf target/distrib/stems-cli-x86_64-unknown-linux-gnu.tar.xz > "$RUNNER_TEMP/contents.txt"
          for f in stems completions/_stems completions/stems.bash completions/stems.fish man/stems.1 man/stems-up.1; do
            grep -q "/$f\$" "$RUNNER_TEMP/contents.txt" || { echo "missing $f in tarball"; cat "$RUNNER_TEMP/contents.txt"; exit 1; }
          done
