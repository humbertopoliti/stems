name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

# CI is the regression subset (`make ci`): fmt, clippy, unit and in-process
# tests, YAML lint, release packaging checks. Tests that start processes, the
# example services, the e2e suite and Docker run locally (`make check`).
jobs:
  check-macos:
    runs-on: macos-latest
    # Backstop; nextest kills a hung test after 120 s (.config/nextest.toml).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Save even when the run fails: a red run still warms the next.
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: make ci NEXTEST_PROFILE=ci

  check-linux:
    runs-on: ubuntu-latest
    # Backstop; nextest kills a hung test after 120 s (.config/nextest.toml).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Save even when the run fails: a red run still warms the next.
          cache-on-failure: true
      - uses: taiki-e/install-action@nextest
      - run: make ci NEXTEST_PROFILE=ci

  # Release packaging (deliverable 32): binary size budget (< 25 MB),
  # formula template golden, completions/man generation, cargo-dist config.
# The installed-binary smoke test runs in the release pipeline (release-smoke.yml).
  release-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Save even when the run fails: a red run still warms the next.
          cache-on-failure: true
      - run: make test-release
      - run: make size
      - run: STEMS_BIN=target/release/stems release/build-extras.sh
      - name: cargo-dist plan
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          dist plan
