name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-macos
          # Failing scenarios' temp dirs (workspace copy, STEMS_HOME with
          # daemon logs/state, harness-report.txt), copied by the harness.
          path: target/e2e-failures/
          if-no-files-found: ignore
          retention-days: 7

  check-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make check
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-linux
          # Failing scenarios' temp dirs (workspace copy, STEMS_HOME with
          # daemon logs/state, harness-report.txt), copied by the harness.
          path: target/e2e-failures/
          if-no-files-found: ignore
          retention-days: 7

  check-linux-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Docker info
        run: docker version && docker compose version
      - run: make check-docker
      - name: Upload e2e failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failures-linux-docker
          # Failing scenarios' temp dirs (workspace copy, STEMS_HOME with
          # daemon logs/state, harness-report.txt), copied by the harness.
          path: target/e2e-failures/
          if-no-files-found: ignore
          retention-days: 7

  # Release packaging (deliverable 32): binary size budget (< 25 MB),
  # formula template golden, completions/man generation, cargo-dist config.
  release-checks:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: make test-release
      - run: make size
      - run: STEMS_BIN=target/release/stems release/build-extras.sh
      - run: release/smoke.sh target/release/stems
        env:
          SMOKE_STRICT_LEAKS: "1"
      - name: cargo-dist plan
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh | sh
          dist plan
