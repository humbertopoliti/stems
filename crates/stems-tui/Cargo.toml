[package]
name = "stems-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The stems terminal dashboard (ratatui): table, detail, headless frame replay"

[dependencies]
stems-api = { workspace = true }
stems-core = { workspace = true }
stems-config = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache", "underline-color"] }
toml = "1"
crossterm = { version = "0.29", features = ["event-stream"] }
unicode-width = "0.2.2"

[dev-dependencies]
insta = { workspace = true }
tempfile = { workspace = true }
