[package]
name = "stems-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Local environment management toolkit for multi-process systems"

[[bin]]
name = "stems"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["derive", "env", "wrap_help"] }
stems-config = { workspace = true }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
anyhow = "1.0.104"
serde_json.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
stems-core.workspace = true
stems-api = { workspace = true }
stems-daemon = { workspace = true }
stems-tui = { workspace = true }
stems-mcp = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

# Release packaging (deliverable 32): cargo-dist only builds packages that
# opt in; this is the one shipped (config in /dist-workspace.toml).
[package.metadata.dist]
dist = true
