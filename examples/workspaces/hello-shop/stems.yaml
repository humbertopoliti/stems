# stems.yaml — the hello-shop integration repo.
#
# This is a worked example that exercises every v1 stem type and every graph
# feature (REQUIREMENTS.md §7.1). It is heavily commented on purpose: this
# file is the primary documentation for the config format, alongside
# REQUIREMENTS.md §6.6 (the sketch this was adapted from).
#
# Needs only Docker (Desktop, Colima, ...) and python3 on the host: every
# postgres/redis interaction goes through the containers (`docker exec`),
# so no host `psql`, `pg_isready` or `redis-cli` is required.
# See examples/README.md.

schema_version: 1
name: hello-shop

# ---------------------------------------------------------------------------
# Named variables, usable anywhere as ${var.<name>}.
# ---------------------------------------------------------------------------
vars:
  pg_user: shop

# ---------------------------------------------------------------------------
# Tool requirements checked by `stems doctor` / `stems validate`.
# We deliberately do NOT require docker or node here: CI machines without
# Docker must still be able to validate this workspace (see DECISIONS.md).
# ---------------------------------------------------------------------------
requires:
  python3: ">=3.9"

# ---------------------------------------------------------------------------
# Agent / MCP interface guard (FR-AI-3). Destructive MCP operations
# (down --volumes, reset, killing orphans) are refused unless this is true
# or the caller passes confirm: true AND this is enabled.
# ---------------------------------------------------------------------------
agent:
  allow_destructive: false

# ---------------------------------------------------------------------------
# Named subsets of stems (FR-WS-8). `stems up --profile backend`.
# ---------------------------------------------------------------------------
profiles:
  default: [postgres, redis, shop-api, shop-worker, shop-web, httpbin]
  backend: [postgres, redis, shop-api, shop-worker]
  # process-only omits postgres/redis on purpose to demonstrate that a
  # profile is just a *starting set*: shop-api's depends_on still names
  # postgres and redis, so `up --profile process-only` pulls them in as
  # hard dependencies (event `profile.expanded`), unless
  # `strict_profiles: true`, which refuses the profile instead
  # (PROFILE_MISSING_DEPENDENCY). See docs/config.md.
  process-only: [shop-api, shop-worker, shop-web]

# ---------------------------------------------------------------------------
# Workspace-level scripts. Run with `stems run --workspace <name>`.
# ---------------------------------------------------------------------------
scripts:
  bootstrap: scripts/bootstrap.sh
  teardown: scripts/teardown.sh
  nuke-databases:
    file: scripts/nuke.sh
    description: Drop and recreate all local databases
    requires: [postgres]

stems:
  # -------------------------------------------------------------------------
  # postgres — type: docker
  # Demonstrates: image, ports, volumes, env, command health check (run
  # inside the container), `reset` and `seed`/`seed-large` scripts.
  # -------------------------------------------------------------------------
  postgres:
    type: docker
    description: Postgres 16 database backing shop-api
    image: postgres:16
    ports: [{ name: pg, port: 15432, container_port: 5432 }]
    env:
      POSTGRES_USER: "${var.pg_user}"
      POSTGRES_PASSWORD: local
      POSTGRES_DB: shop
    volumes: ["hello-shop-pgdata:/var/lib/postgresql/data"]
    # A `command` probe of a docker/compose stem runs inside the container
    # (`docker exec <id> sh -c ...`), so pg_isready comes from the image and
    # the port is the container's 5432. `-h 127.0.0.1` matters: on first
    # start the image runs a temporary socket-only server for its init
    # scripts, then restarts; probing over TCP waits for the real server, so
    # `seed` never races that restart.
    health:
      type: command
      command: "pg_isready -h 127.0.0.1 -U ${var.pg_user} -d shop"
      interval: 400ms
      timeout: 2s
      retries: 5
      start_period: 1s
      start_timeout: 120s
    stop_grace: 2s
    scripts:
      # Named volumes are prefixed `<ws>_` by stems (`hello-shop-pgdata` →
      # `hello-shop_pgdata`). `reset` stops and removes the container first;
      # the `docker rm` covers one left stopped by `stems stop`.
      reset: "docker rm -f hello-shop-postgres >/dev/null 2>&1; docker volume rm -f hello-shop_pgdata"
      seed:
        file: scripts/postgres/seed.sh
        description: Apply migrations and insert a handful of sample rows
      seed-large:
        file: scripts/postgres/seed-large.sh
        description: Load a large synthetic dataset for perf testing
        args: [{ name: rows, type: int, default: 1000000 }]

  # -------------------------------------------------------------------------
  # redis — type: compose
  # Demonstrates: wrapping an existing docker-compose file; the command
  # health check runs inside the service's container (container port 6379).
  # -------------------------------------------------------------------------
  redis:
    type: compose
    description: Redis 7, used as shop-worker's queue and shop-api's cache
    file: compose/redis.yml
    service: redis
    project_name: hello-shop
    # Stem env is compose's interpolation input: the file publishes
    # ${REDIS_PORT:-16379}, so pass the stem's (possibly overridden) port.
    env:
      REDIS_PORT: "${stem.self.port}"
    ports: [{ name: redis, port: 16379, container_port: 6379 }]
    health:
      type: command
      command: "redis-cli ping"
      interval: 400ms
      timeout: 2s
      retries: 5
      start_period: 1s
    stop_grace: 2s

  # -------------------------------------------------------------------------
  # shop-api — type: process
  # Demonstrates: git-free local codebase path, `setup` with stamps and
  # `inputs`, env files, an overlay, http health, a watchdog restart, custom
  # scripts with args, depends_on postgres (healthy) + redis (healthy), and a
  # `docker` variant (FR-ST-8, `stems switch shop-api docker`).
  # -------------------------------------------------------------------------
  shop-api:
    type: process
    description: Python stdlib HTTP service (products, users, chaos endpoints)
    codebase: ../../repos/shop-api
    depends_on:
      - { stem: postgres, condition: healthy }
      - { stem: redis, condition: healthy }
    env_files: [env/shop-api.env]
    env:
      PORT: "18080"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://${var.pg_user}:local@localhost:${stem.postgres.port}/shop"
      # shop-api reads /products with psql; run it inside the postgres
      # container so the host needs no psql client.
      SHOP_PSQL: "docker exec hello-shop-postgres psql -U ${var.pg_user} -d shop"
      REDIS_URL: "redis://localhost:${stem.redis.port}"
      SHOP_CONFIG: "${codebase}/config/local.ini"
      SHOP_CHAOS: "1"
    overlays:
      - { template: overlays/shop-api/local.ini.tmpl, dest: config/local.ini }
    ports: [{ name: http, port: 18080 }]
    health:
      type: http
      url: "http://localhost:${stem.shop-api.port}/healthz"
      interval: 400ms
      timeout: 300ms
      retries: 5
      start_period: 1s
    stop_grace: 2s
    scripts:
      setup:
        file: scripts/shop-api/setup.sh
        inputs: ["migrations/**"]
      seed:
        command: "echo 'shop-api seed: products are already seeded via postgres seed script, nothing to do'"
      start: python3 app.py
      create-test-user:
        file: scripts/shop-api/create-test-user.sh
        description: Create a user with a known password for manual testing
        args:
          - { name: email, type: string, required: true, description: "Email address of the test user" }
          - { name: role, type: enum, values: [admin, user], default: admin, description: "Role to grant" }
    watch:
      - { paths: ["*.py"], action: restart, debounce: 800ms }
    # `stems switch shop-api docker` runs the same codebase as a container
    # (built from its Dockerfile); `stems switch shop-api local` goes back.
    variants:
      docker:
        type: docker
        build: { context: "${codebase}" }
        ports: [{ name: http, port: 18080, container_port: 8080 }]
        volumes: ["${codebase}/config:/app/config:ro"]
        env:
          PORT: "8080"
          DATABASE_URL: "postgres://${var.pg_user}:local@host.docker.internal:${stem.postgres.port}/shop"
          SHOP_PSQL: ""
          SHOP_CONFIG: /app/config/local.ini
        health: { start_timeout: 3m }

  # -------------------------------------------------------------------------
  # shop-worker — type: process
  # Demonstrates: on-failure restart policy with backoff, depends on redis
  # (healthy) + postgres (seeded), a control port for chaos commands.
  # -------------------------------------------------------------------------
  shop-worker:
    type: process
    description: Redis queue consumer with a chaos control HTTP port
    codebase: ../../repos/shop-worker
    depends_on:
      - { stem: redis, condition: healthy }
      - { stem: postgres, condition: seeded }
    env_files: []
    env:
      REDIS_URL: "redis://localhost:${stem.redis.port}"
      SHOP_QUEUE: "shop-jobs"
      SHOP_CONTROL_PORT: "18081"
      SHOP_CHAOS: "1"
    ports: [{ name: control, port: 18081 }]
    health:
      type: tcp
      port: 18081
      interval: 400ms
      timeout: 300ms
      retries: 5
      start_period: 1s
    stop_grace: 2s
    restart:
      policy: on-failure
      max: 5
    scripts:
      start: python3 worker.py

  # -------------------------------------------------------------------------
  # shop-web — type: process
  # Demonstrates: port: auto, ${stem.shop-api.port} substitution, depends
  # on shop-api with edge metadata (`protocol: http`, shown by
  # `stems graph --edges` and the TUI graph's `e` key; FR-GR-5).
  # -------------------------------------------------------------------------
  shop-web:
    type: process
    description: Static site + tiny dev server that renders the product list
    codebase: ../../repos/shop-web
    depends_on:
      - { stem: shop-api, protocol: http }
    env:
      API_URL: "http://localhost:${stem.shop-api.port}"
    ports: [{ name: http, port: auto }]
    health:
      type: http
      url: "http://localhost:${stem.shop-web.port}/"
      interval: 400ms
      timeout: 300ms
      retries: 5
      start_period: 1s
    stop_grace: 2s
    scripts:
      start: python3 serve.py

  # -------------------------------------------------------------------------
  # httpbin — type: external
  # Demonstrates: monitor-only, shows `unknown` when offline. Never started
  # or stopped by stems.
  # -------------------------------------------------------------------------
  httpbin:
    type: external
    description: Public httpbin instance, treated as a hosted dependency
    health:
      type: http
      url: "https://httpbin.org/get"
      interval: 500ms
      # A fresh TLS handshake to a public host takes ~0.5 s from Europe.
      timeout: 2s
      retries: 3
