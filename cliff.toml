# git-cliff configuration (deliverable 32): CHANGELOG.md from conventional
# commits (`feat(scope): …`, `fix: …`, `chore: …`).
#
#   git cliff -o CHANGELOG.md                       # everything, unreleased on top
#   git cliff --tag v0.1.0-rc.1 -o CHANGELOG.md     # before tagging a release
#
# The release workflow (.github/workflows/release-changelog.yml) regenerates
# and commits it after each stable release. cargo-dist reads the section of
# the version being released for the GitHub Release notes.

[changelog]
header = """
# Changelog

All notable changes to stems are listed here. The file is generated by
[git-cliff](https://git-cliff.org) from conventional commits (`cliff.toml`);
edit commit messages, not this file. Scopes are deliverable numbers from
`plan/` (e.g. `feat(10)`).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^doc", group = "<!-- 3 -->Documentation" },
    { message = "^refactor", group = "<!-- 4 -->Refactoring" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^(chore|ci|build)", group = "<!-- 6 -->Maintenance" },
    { body = ".*security", group = "<!-- 7 -->Security" },
]
