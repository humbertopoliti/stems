[package]
name = "stems-e2e"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
cucumber = "0.23"
futures = "0.3.34"
nix = { version = "0.31", features = ["signal", "process", "user"] }
regex = "1.13.1"
serde_json.workspace = true
serde_json_path = "0.7.2"
serde_yaml_ng.workspace = true
# `When I call the daemon RPC ...` talks to the socket with the real client.
stems-api = { workspace = true }
stems-core = { workspace = true }
stems-runtime = { workspace = true }
# The MCP test client (31): an rmcp client over the `stems mcp` child's stdio.
rmcp = { workspace = true, features = ["client", "transport-async-rw"] }
tempfile.workspace = true
# Log steps (12): archive contents and timestamp ordering.
tar = { workspace = true }
flate2 = { workspace = true }
chrono = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "time", "io-util", "sync", "net", "signal"] }

# The cucumber suite. `test = false` keeps it out of `cargo test --workspace`
# (it needs the `stems` binary built first); run it with `make e2e`, i.e.
# `cargo build -p stems-cli && cargo test -p stems-e2e --test e2e`.
[[test]]
name = "e2e"
path = "tests/e2e.rs"
harness = false
test = false
