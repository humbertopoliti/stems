# with-external — fixture for external/not-managed.feature (FR-ST-3): one
# process stem that depends on an external stem. stems never starts or
# stops `hosted`; it has no health check, so its state is `unknown` and the
# edge to it (even `condition: healthy`) is satisfied immediately.
schema_version: 1
name: with-external

stems:
  api:
    type: process
    codebase: ../../../../examples/repos/shop-api
    depends_on: [{ stem: hosted, condition: healthy }]
    ports: [{ name: http, port: 18601 }]
    health: { type: tcp, interval: 200ms, timeout: 150ms, retries: 5, start_timeout: 10s }
    stop_grace: 1s
    scripts: { start: python3 app.py }
  hosted:
    type: external
    description: A hosted dependency stems only monitors
