# disabled-demo — fixture for tests/features/config/disabled.feature
# (FR-WS-8, deliverable 46).
#
# `search` is enabled only when WITH_SEARCH is truthy (unset = disabled).
# `api` needs it (a hard edge, `if_disabled: skip` by default) and
# `postgres`: with search disabled, `up` skips api. `worker` has an
# `if_disabled: start` edge to search: it starts either way. Each stem is a
# tiny Python HTTP server.
schema_version: 1
name: disabled-demo

stems:
  postgres:
    type: process
    ports: [{ name: http, port: 18471 }]
    scripts:
      start: python3 -m http.server ${stem.self.port} --bind 127.0.0.1
    health: { type: tcp, interval: 200ms, timeout: 150ms, retries: 5, start_timeout: 10s }
    stop_grace: 1s
  search:
    type: process
    enabled: "${env.WITH_SEARCH}"
    ports: [{ name: http, port: 18472 }]
    scripts:
      start: python3 -m http.server ${stem.self.port} --bind 127.0.0.1
    health: { type: tcp, interval: 200ms, timeout: 150ms, retries: 5, start_timeout: 10s }
    stop_grace: 1s
  api:
    type: process
    depends_on: [search, postgres]
    ports: [{ name: http, port: 18473 }]
    scripts:
      start: python3 -m http.server ${stem.self.port} --bind 127.0.0.1
    health: { type: tcp, interval: 200ms, timeout: 150ms, retries: 5, start_timeout: 10s }
    stop_grace: 1s
  worker:
    type: process
    depends_on: [{ stem: search, if_disabled: start }]
    ports: [{ name: http, port: 18474 }]
    scripts:
      start: python3 -m http.server ${stem.self.port} --bind 127.0.0.1
    health: { type: tcp, interval: 200ms, timeout: 150ms, retries: 5, start_timeout: 10s }
    stop_grace: 1s
