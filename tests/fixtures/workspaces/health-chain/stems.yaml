# health-chain — fixture for health/{dependency-degraded,edge-waits,flapping}.feature
# (deliverable 21). Two shop-api processes with `http` probes on /healthz:
# `web` depends on `api` (hard, `condition: healthy`). `api` has the chaos
# endpoints, so `/__chaos/unhealthy?for=...` makes its /healthz answer 503.
# retries 1: a single failed probe makes it `unhealthy` (flapping needs fast
# toggles). `PORT` is set by stems from each stem's first port.
schema_version: 1
name: health-chain

stems:
  api:
    type: process
    codebase: ../../../../examples/repos/shop-api
    env: { SHOP_CHAOS: "1" }
    ports: [{ name: http, port: 18721 }]
    health:
      type: http
      url: http://127.0.0.1:18721/healthz
      interval: 200ms
      timeout: 150ms
      retries: 1
      start_timeout: 10s
    stop_grace: 1s
    scripts: { start: python3 app.py }
  web:
    type: process
    codebase: ../../../../examples/repos/shop-api
    depends_on: [{ stem: api, condition: healthy }]
    ports: [{ name: http, port: 18722 }]
    health:
      type: http
      url: http://127.0.0.1:18722/healthz
      interval: 200ms
      timeout: 150ms
      retries: 2
      start_timeout: 10s
    stop_grace: 1s
    scripts: { start: python3 app.py }
